[package]
name = "replicaman-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "Storage-independent Replicaman synchronization server"
license = "MIT"
publish = false

[dependencies]
axum = "0.8.9"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std"] }
hmac = "0.13"
mime = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[[example]]
name = "server"
path = "examples/server.rs"
